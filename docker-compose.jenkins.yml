# =============================================================================
# CI de NeuroInventory: Jenkins + SonarQube Community
#
# Es independiente de docker-compose.yml (la plataforma): solo levanta el CI y
# reutiliza el daemon de Docker del host para Testcontainers y para construir
# las imágenes de los servicios.
#
#   docker compose -f docker-compose.jenkins.yml up -d --build
#
# Acceso:
#   Jenkins   -> http://localhost:8085  (credenciales en JENKINS_ADMIN_*)
#   SonarQube -> http://localhost:9000  (admin; la clave la fija sonar-init.sh)
#
# SonarQube necesita `vm.max_map_count >= 524288` en el host (ver
# docs/development/sonarqube.md).
# =============================================================================

name: neuroinventory-jenkins

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    image: neuroinventory/jenkins:local
    container_name: neuroinventory-jenkins
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

    # El socket de Docker ya concede acceso root-equivalente al host, así que
    # ejecutar como root evita problemas de GID con el socket y con las cachés
    # de Gradle/npm/pip. Si prefieres el usuario `jenkins`, añade:
    #   group_add: ["<GID de /var/run/docker.sock>"]
    user: root

    ports:
      - "${JENKINS_PORT:-8085}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"

    environment:
      JENKINS_URL: "http://localhost:${JENKINS_PORT:-8085}/"
      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:-admin}"

      # Job que crea JCasC al arrancar.
      GIT_REPO_URL: "${GIT_REPO_URL:-https://github.com/Alexlizzt/NeuroInventory.git}"
      GIT_BRANCH: "${GIT_BRANCH:-main}"

      # Credencial `dockerhub` para publicar imágenes.
      DOCKERHUB_USERNAME: "${DOCKERHUB_USERNAME:-neuroinventory}"
      DOCKERHUB_TOKEN: "${DOCKERHUB_TOKEN:-changeme}"

      # Servidor SonarQube y credencial `sonarqube-token` (JCasC). El token se
      # genera una sola vez con `scripts/sonar-init.sh`.
      SONAR_URL: "http://sonarqube:9000"
      SONAR_TOKEN: "${SONAR_TOKEN:-}"

      # Testcontainers: los contenedores se crean en el daemon del host y el
      # JVM de las pruebas los alcanza por el gateway de Docker.
      TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_HOST: "unix:///var/run/docker.sock"

      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Duser.timezone=UTC"

    # Permite que Testcontainers llegue a los puertos publicados en el host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # ---------------------------------------------------------------------------
  # SonarQube Community (calidad de código del monorepo)
  # ---------------------------------------------------------------------------
  sonar-db:
    image: postgres:16-alpine
    container_name: neuroinventory-sonar-db
    restart: unless-stopped
    logging: *default-logging

    environment:
      POSTGRES_DB: "${SONAR_DB_NAME:-sonarqube}"
      POSTGRES_USER: "${SONAR_DB_USER:-sonarqube}"
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD:-sonarqube}"

    volumes:
      - sonar_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonarqube} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: neuroinventory-sonarqube
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

    depends_on:
      sonar-db:
        condition: service_healthy

    ports:
      - "${SONAR_PORT:-9000}:9000"

    environment:
      # PostgreSQL propio: SonarQube no soporta su base de datos embebida en
      # Docker para uso continuado.
      SONAR_JDBC_URL: "jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonarqube}"
      SONAR_JDBC_USERNAME: "${SONAR_DB_USER:-sonarqube}"
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD:-sonarqube}"

      # El host tiene 31 GB: se limita la JVM para no competir con Jenkins.
      SONAR_WEB_JAVAOPTS: "-Xms256m -Xmx1g"
      SONAR_CE_JAVAOPTS: "-Xms256m -Xmx2g"

    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

    # Recomendado por SonarQube para el proceso de Elasticsearch.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

volumes:
  jenkins_home:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
