services:

  # ==========================================================================
  # 1. Base de Datos (PostgreSQL + pgvector)
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuroinventory-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh
      - ./docs/architecture/db-init.sql:/scripts/db-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neuroinventory-net

  # ==========================================================================
  # 2. Identidad y seguridad Keycloak
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: neuroinventory-keycloak

    command:
      - start-dev

    environment:
      - KEYCLOAK_ADMIN=${KC_BOOTSTRAP_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_DATABASE=${POSTGRES_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_HEALTH_ENABLED=true

    ports:
      - "${KEYCLOAK_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

    networks:
      - neuroinventory-net


  # ==========================================================================
  # 3. Keycloak Config CLI
  # ==========================================================================
  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:${KEYCLOAK_CONFIG_CLI_VERSION}
    container_name: neuroinventory-keycloak-config

    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      IMPORT_PATH: /config

      KEYCLOAK_AVAILABLE_RETRIES: 20
      KEYCLOAK_AVAILABLE_DELAY: 5000

    depends_on:
      keycloak:
        condition: service_healthy

    volumes:
      - ./config:/config

    command:
      - java
      - -jar
      - /app/keycloak-config-cli.jar

    networks:
      - neuroinventory-net

  # ==========================================================================
  # 3. LLM Local y Embeddings (Ollama)
  # ==========================================================================
  #ollama:
  #  image: ollama/ollama:latest
  #  container_name: neuroinventory-ollama
  #  ports:
  #    - "${OLLAMA_PORT}:11434"
  #  volumes:
  #    - ollama_data:/root/.ollama
  #  networks:
  #    - neuroinventory-net

  # ==========================================================================
  # 4. AI Service (FastAPI)
  # ==========================================================================
  #ai-service:
  #  build: ./ai-service
  #  container_name: neuroinventory-ai-service
  #  environment:
  #    DATABASE_URL: ${DATABASE_URL}
  #    OLLAMA_HOST: ${OLLAMA_HOST}
  #  ports:
  #    - "${AI_SERVICE_PORT}:8000"
  #  depends_on:
  #    postgres:
  #      condition: service_healthy
  #    #ollama:
  #    #  condition: service_started
  #  networks:
  #    - neuroinventory-net

  # ==========================================================================
  # 5. Inventory Service (Spring Boot Backend)
  # ==========================================================================
  inventory-service:
    build: ./inventory-service
    container_name: neuroinventory-inventory-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
    ports:
      - "${INVENTORY_SERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - neuroinventory-net
