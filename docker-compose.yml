x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ==========================================================================
  # 1. Base de Datos (PostgreSQL + pgvector)
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuroinventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh
      - ./docs/architecture/db-init.sql:/scripts/db-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - neuroinventory-net

  # ==========================================================================
  # 2. Identidad y seguridad Keycloak
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: neuroinventory-keycloak
    restart: unless-stopped

    command:
      - start-dev

    environment:
      - KEYCLOAK_ADMIN=${KC_BOOTSTRAP_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_DATABASE=${POSTGRES_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_HEALTH_ENABLED=true

    ports:
      - "${KEYCLOAK_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - neuroinventory-net


  # ==========================================================================
  # 3. Keycloak Config CLI
  # ==========================================================================
  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:${KEYCLOAK_CONFIG_CLI_VERSION}
    container_name: neuroinventory-keycloak-config
    restart: "no"

    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      IMPORT_FILES_LOCATIONS: /config/*

      KEYCLOAK_AVAILABLE_RETRIES: 20
      KEYCLOAK_AVAILABLE_DELAY: 5000

    depends_on:
      keycloak:
        condition: service_healthy

    volumes:
      - ./config:/config:ro

    command:
      - java
      - -jar
      - /app/keycloak-config-cli.jar

    logging: *default-logging
    networks:
      - neuroinventory-net

  # ==========================================================================
  # 4. LLM Local y Embeddings (Ollama)
  # use https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
  #
  # Los modelos ya no se hornean en la imagen: se guardan en el volumen
  # `ollama_data` y se descargan una sola vez con el servicio `ollama-models`.
  # ==========================================================================
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.11}
    container_name: neuroinventory-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G   # Incrementa según la capacidad de tu host
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - neuroinventory-net

  # Descarga idempotente de modelos. Se ejecuta una vez por `compose up` y
  # termina; si los modelos ya están en el volumen, no vuelve a descargarlos.
  ollama-models:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.11}
    container_name: neuroinventory-ollama-models
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} &&
        ollama pull ${LLM_MODEL:-llama3.2}
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    logging: *default-logging
    networks:
      - neuroinventory-net

  # ==========================================================================
  # 5. AI Service (FastAPI)
  # ==========================================================================
  ai-service:
    build: ./ai-service
    container_name: neuroinventory-ai-service
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      OLLAMA_HOST: ${OLLAMA_HOST}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "${AI_SERVICE_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - neuroinventory-net

  # ==========================================================================
  # 6. MCP Server (Model Context Protocol - Agentes IA)
  # ==========================================================================
  mcp-server:
    build: ./mcp-server
    container_name: neuroinventory-mcp-server
    restart: unless-stopped
    init: true
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    ports:
      - "${MCP_SERVER_PORT:-8001}:8001"
    depends_on:
      inventory-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - neuroinventory-net

  # ==========================================================================
  # 7. Inventory Service (Spring Boot Backend)
  # ==========================================================================
  inventory-service:
    build: ./inventory-service
    container_name: neuroinventory-inventory-service
    restart: unless-stopped
    init: true
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
      AI_SERVICE_HOST: ${AI_SERVICE_HOST}
      AI_SERVICE_PORT: ${AI_SERVICE_PORT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BASE_PROBLEM_URI: ${BASE_PROBLEM_URI}
    ports:
      - "${INVENTORY_SERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # El JVM usa MaxRAMPercentage=75 sobre este límite (heap ~1.1G).
          memory: 1536M
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - neuroinventory-net

  # ==========================================================================
  # 8. Frontend Angular
  #
  # En desarrollo se usa el stage `dev` (ng serve + hot reload). La imagen de
  # producción (stage final, Nginx) se construye sin `target`:
  #   docker build -t neuroinventory/frontend:prod ./frontend
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: neuroinventory-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    depends_on:
      inventory-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - neuroinventory-net

volumes:
  postgres_data:
  ollama_data:

networks:
  neuroinventory-net:
    driver: bridge
