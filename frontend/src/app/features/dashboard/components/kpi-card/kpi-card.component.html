<mat-card class="kpi-card" [class]="'tone-' + tone()">
  <div class="kpi-icon">
    <mat-icon>{{ icon() }}</mat-icon>
  </div>

  <div class="kpi-content">
    <span class="kpi-label" [matTooltip]="hint()">{{ label() }}</span>
    <span class="kpi-value">{{ value() }}</span>
    @if (hint()) {
      <span class="kpi-hint">{{ hint() }}</span>
    }
  </div>
</mat-card>
