<mat-sidenav-container class="sidenav-container">
  <!-- Navegación Lateral (Sidenav) -->
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <div class="brand-header">
      <mat-icon class="brand-icon">memory</mat-icon>
      <span class="brand-title">NeuroInventory</span>
    </div>

    <mat-divider></mat-divider>

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenido Principal -->
  <mat-sidenav-content class="sidenav-content">
    <!-- Toolbar Superior -->
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" matTooltip="Alternar menú">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="spacer"></span>

      <!-- Menú de Perfil de Usuario -->
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <mat-icon>account_circle</mat-icon>
        <span class="username">{{ username() || 'Usuario' }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="user-info-header" (click)="$event.stopPropagation()">
          <p class="info-name">{{ username() }}</p>
          <p class="info-roles">Roles: {{ userRoles().join(', ') }}</p>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon color="warn">logout</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <!-- Vista de la Ruta Activa -->
    <main class="main-container">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
