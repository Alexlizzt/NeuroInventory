server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Configuración runtime: se sirve sin caché para que un ConfigMap de
    # Kubernetes o un cambio de entorno se aplique al recargar la página.
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Healthcheck del contenedor.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Angular es una SPA: las rutas desconocidas deben caer en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash: se pueden cachear de forma agresiva.
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|ico|png|jpe?g|gif|svg|webp|avif)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
