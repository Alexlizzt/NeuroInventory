# =============================================================================
# Análisis de SonarQube para todo el monorepo NeuroInventory
#
# Lo consume `sonarsource/sonar-scanner-cli`, que el Jenkinsfile ejecuta desde
# la raíz del workspace. El servidor se levanta con docker-compose.jenkins.yml.
#
# Uso manual (con SonarQube en http://localhost:9000):
#   docker run --rm -e SONAR_HOST_URL=http://host.docker.internal:9000 \
#     -e SONAR_TOKEN=<token> -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli:12.3
# =============================================================================

sonar.projectKey=neuroinventory
sonar.projectName=NeuroInventory
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# --- Código fuente de los cuatro módulos ------------------------------------
sonar.sources=\
  inventory-service/src/main/java,\
  frontend/src,\
  ai-service/app,\
  ai-service/main.py,\
  mcp-server/app,\
  mcp-server/main.py

# --- Pruebas ----------------------------------------------------------------
# En el frontend las pruebas conviven con el código (*.spec.ts), por eso se
# declara `src` también como raíz de tests y se afinan con test.inclusions.
sonar.tests=\
  inventory-service/src/test/java,\
  frontend/src,\
  ai-service/tests,\
  mcp-server/tests

sonar.test.inclusions=\
  inventory-service/src/test/java/**/*.java,\
  frontend/src/**/*.spec.ts,\
  ai-service/tests/**/*.py,\
  mcp-server/tests/**/*.py

# --- Exclusiones ------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/out/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/.angular/**,\
  **/coverage/**,\
  **/.kilo/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.d.ts,\
  frontend/src/assets/**

# --- Java (inventory-service) ----------------------------------------------
sonar.java.source=21
sonar.java.binaries=inventory-service/build/classes/java/main
sonar.java.test.binaries=inventory-service/build/classes/java/test
sonar.junit.reportPaths=inventory-service/build/test-results/test
sonar.coverage.jacoco.xmlReportPaths=inventory-service/build/reports/jacoco/test/jacocoTestReport.xml

# --- Python (ai-service) ----------------------------------------------------
sonar.python.version=3.13
sonar.python.coverage.reportPaths=ai-service/reports/coverage.xml

# --- JavaScript/TypeScript (frontend) --------------------------------------
# La cobertura del frontend se activará cuando el pipeline ejecute `ng test`
# con cobertura (requiere Chrome/Chromium en el agente):
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
