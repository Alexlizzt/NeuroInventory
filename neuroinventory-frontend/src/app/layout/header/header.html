<header class="header">
  <div class="brand">NeuroInventory</div>

  <div class="user">
    <div class="user-info">
      <span class="user-name">
        {{ user()?.name }}
      </span>

      <span class="user-email">
        {{ user()?.email }}
      </span>
    </div>

    <button type="button" class="user-button" aria-label="Sign out" (click)="logout()">
      Logout
    </button>
  </div>
</header>
