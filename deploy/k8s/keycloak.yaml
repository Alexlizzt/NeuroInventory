apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  # Liquibase no soporta migraciones concurrentes: nunca debe haber dos pods
  # de Keycloak arrancando a la vez contra la misma base de datos.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgres
            - name: KC_DB_URL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KEYCLOAK_DB
            - name: KC_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neuroinventory-secrets
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: neuroinventory-secrets
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neuroinventory-secrets
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            # El issuer debe coincidir con la URL pública que usa el frontend.
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KEYCLOAK_HOST
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            # start-dev ejecuta el build de Quarkus al arrancar; con el 50 % del
            # límite (2Gi) el heap queda en ~1 Gi y no agota el cgroup del pod.
            - name: JAVA_OPTS_APPEND
              value: "-XX:MaxRAMPercentage=50"
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            # El primer arranque incluye el build de Quarkus y las migraciones
            # de Liquibase; con 10 min de margen no se reinicia a mitad de ellas.
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
