apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: neuroinventory

resources:
  - namespace.yaml
  - postgres.yaml
  - postgres-init-job.yaml
  - keycloak.yaml
  - keycloak-config-job.yaml
  - ollama.yaml
  - ollama-models-job.yaml
  - ai-service.yaml
  - mcp-server.yaml
  - inventory-service.yaml
  - frontend.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: neuroinventory
      app.kubernetes.io/managed-by: kustomize
