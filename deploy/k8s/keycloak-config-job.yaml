apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  labels:
    app: keycloak-config
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: keycloak-config
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://keycloak:8080/health/ready; do sleep 3; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: keycloak-config-cli
          image: adorsys/keycloak-config-cli:latest-24
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -jar
            - /app/keycloak-config-cli.jar
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: neuroinventory-secrets
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neuroinventory-secrets
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: IMPORT_FILES_LOCATIONS
              value: /config/*
            - name: KEYCLOAK_AVAILABLE_RETRIES
              value: "30"
            - name: KEYCLOAK_AVAILABLE_DELAY
              value: "5000"
          volumeMounts:
            - name: realm
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
