apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuroinventory
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    # Frontend + API en el mismo origen (la API se sirve bajo /api).
    - host: __FRONTEND_HOST__
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # Keycloak en su propio host para que el issuer de los tokens sea estable.
    - host: __KEYCLOAK_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
