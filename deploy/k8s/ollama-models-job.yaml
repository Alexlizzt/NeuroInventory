apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-models
  labels:
    app: ollama-models
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: ollama-models
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://ollama:11434/api/tags; do sleep 3; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: pull-models
          image: ollama/ollama:0.40.11
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - ollama pull "$EMBEDDING_MODEL" && ollama pull "$LLM_MODEL"
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EMBEDDING_MODEL
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LLM_MODEL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
