apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  selector:
    app: mcp-server
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z inventory-service 8080 && nc -z ai-service 8000; do sleep 3; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: mcp-server
          image: neuroinventory/mcp-server:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8080
            - name: AI_SERVICE_URL
              value: http://ai-service:8000
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neuroinventory-secrets
                  key: INTERNAL_API_KEY
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: "8001"
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: neuroinventory-secrets
                  key: SERVICE_TOKEN
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
